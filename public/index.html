<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' style='dominant-baseline:central;text-anchor:middle;font-size:90px;'%3E📝%3C/text%3E%3C/svg%3E" type="image/svg+xml">
    <style>
        :root {
            --bg: #fdfdfd;
            --surface: #ffffff;
            --text: #1a1a1a;
            --muted: #6b7280;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --surface: #2a2a2a;
                --text: #fdfdfd;
                --muted: #a0a0a0;
                --accent: #818cf8;
                --accent-hover: #6366f1;
                --border: #3a3a3a;
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
            width: 100%;
        }

        header {
            background-color: var(--surface);
            padding: 32px 0;
            box-shadow: var(--shadow);
            border-bottom: 1px solid var(--border);
            margin-bottom: 64px;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--accent);
        }

        main {
            flex-grow: 1;
            padding-bottom: 64px;
        }

        .card {
            background-color: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 32px;
            margin-bottom: 32px;
        }

        .form-group {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--bg);
            color: var(--text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            padding: 12px 24px;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.15s ease, transform 0.15s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--muted);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item input[type="checkbox"] {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--muted);
            border-radius: 6px;
            cursor: pointer;
            display: grid;
            place-content: center;
            flex-shrink: 0;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .todo-item input[type="checkbox"]::before {
            content: "";
            width: 14px;
            height: 14px;
            transform: scale(0);
            transition: transform 0.15s ease;
            box-shadow: inset 1em 1em var(--surface);
            background-color: var(--surface);
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .todo-item input[type="checkbox"]:checked {
            border-color: var(--accent);
            background-color: var(--accent);
        }

        .todo-item input[type="checkbox"]:checked::before {
            transform: scale(1);
        }

        .todo-item input[type="checkbox"]:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.4);
        }

        .todo-item-content {
            flex-grow: 1;
            font-size: 18px;
            word-break: break-word;
        }

        .todo-item-content.completed {
            text-decoration: line-through;
            color: var(--muted);
        }

        .delete-button {
            background-color: transparent;
            color: var(--muted);
            padding: 8px;
            border-radius: 8px;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .delete-button:hover:not(:disabled) {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
            transform: translateY(-1px);
        }

        .delete-button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.4);
        }

        .empty-state, .loading-state, .error-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--muted);
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .empty-state svg, .loading-state svg, .error-state svg {
            width: 48px;
            height: 48px;
            color: var(--border);
        }

        .error-state {
            color: #ef4444;
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            margin-top: 64px;
            padding: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            border-top: 1px solid var(--border);
            background-color: var(--surface);
        }

        @media (max-width: 600px) {
            .form-group {
                flex-direction: column;
                gap: 12px;
            }
            button {
                width: 100%;
            }
            .card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>My Todo List</h1>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Add a new task</h2>
            <form id="todo-form" class="form-group">
                <input type="text" id="todo-input" placeholder="What needs to be done?" aria-label="New todo item" required>
                <button type="submit" id="add-todo-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Add Task
                </button>
            </form>
            <p id="form-error" class="error-state" style="display: none;"></p>
        </section>

        <section class="card">
            <h2>My Tasks</h2>
            <div id="loading-state" class="loading-state" style="display: none;">
                <div class="spinner"></div>
                <p>Loading tasks...</p>
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <p>No tasks yet! Add one above.</p>
            </div>
            <div id="error-state" class="error-state" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <p>Failed to load tasks. Please try again.</p>
            </div>
            <ul id="todo-list" class="todo-list">
                <!-- Todo items will be rendered here -->
            </ul>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 My Todo List. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const addTodoButton = document.getElementById('add-todo-button');
        const todoList = document.getElementById('todo-list');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');
        const errorState = document.getElementById('error-state');
        const formError = document.getElementById('form-error');

        async function fetchTodos() {
            loadingState.style.display = 'flex';
            emptyState.style.display = 'none';
            errorState.style.display = 'none';
            todoList.innerHTML = '';

            try {
                const response = await fetch('/todos');
                if (!response.ok) {
                    throw new Error('Network response was not ok.');
                }
                const todos = await response.json();
                renderTodos(todos);
            } catch (error) {
                console.error('Error fetching todos:', error);
                errorState.style.display = 'flex';
            } finally {
                loadingState.style.display = 'none';
            }
        }

        function renderTodos(todos) {
            todoList.innerHTML = '';
            if (todos.length === 0) {
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';

            todos.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

            todos.forEach(todo => {
                const listItem = document.createElement('li');
                listItem.className = 'todo-item';
                listItem.setAttribute('data-id', todo.id);

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.setAttribute('aria-label', 'Mark ' + todo.content + ' as complete');
                checkbox.addEventListener('change', () => toggleTodo(todo.id, checkbox.checked));

                const contentSpan = document.createElement('span');
                contentSpan.className = 'todo-item-content';
                contentSpan.textContent = todo.content;
                if (todo.completed) {
                    contentSpan.classList.add('completed');
                }

                const deleteButton = document.createElement('button');
                deleteButton.className = 'delete-button';
                deleteButton.setAttribute('aria-label', 'Delete ' + todo.content);
                deleteButton.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
                deleteButton.addEventListener('click', () => deleteTodo(todo.id));

                listItem.appendChild(checkbox);
                listItem.appendChild(contentSpan);
                listItem.appendChild(deleteButton);
                todoList.appendChild(listItem);
            });
        }

        async function addTodo(content) {
            addTodoButton.disabled = true;
            formError.style.display = 'none';
            formError.textContent = '';

            try {
                const response = await fetch('/todos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ content: content }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to add todo.');
                }

                todoInput.value = '';
                await fetchTodos();
            } catch (error) {
                console.error('Error adding todo:', error);
                formError.textContent = error.message;
                formError.style.display = 'block';
            } finally {
                addTodoButton.disabled = false;
            }
        }

        async function toggleTodo(id, completed) {
            try {
                const response = await fetch('/todos/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ completed: completed }),
                });

                if (!response.ok) {
                    throw new Error('Failed to update todo status.');
                }
                await fetchTodos();
            } catch (error) {
                console.error('Error toggling todo:', error);
                alert('Failed to update todo status. Please try again.');
            }
        }

        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this task?')) {
                return;
            }
            try {
                const response = await fetch('/todos/' + id, {
                    method: 'DELETE',
                });

                if (!response.ok) {
                    throw new Error('Failed to delete todo.');
                }
                await fetchTodos();
            } catch (error) {
                console.error('Error deleting todo:', error);
                alert('Failed to delete todo. Please try again.');
            }
        }

        todoForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const content = todoInput.value.trim();
            if (content) {
                addTodo(content);
            } else {
                formError.textContent = 'Task content cannot be empty.';
                formError.style.display = 'block';
            }
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', fetchTodos);
    </script>
</body>
</html>
